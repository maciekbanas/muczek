<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Muczek i Przyjaciele."
    />
    <title>Muczek i Przyjaciele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      data-goatcounter="https://muczek.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#top" aria-label="Muczek i Przyjaciele — strona główna">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>MUCZEK I PRZYJACIELE</span>
      </a>
      <nav aria-label="Główna nawigacja">
        <a href="#komiksy">Komiksy</a>
        <a href="#kontakt">Kontakt</a>
      </nav>
    </header>

    <main id="top">
      <section class="comics-section" id="komiksy" aria-labelledby="comics-title">
        <h2 id="comics-title" class="visually-hidden">Komiksy</h2>
        <div class="comic-list"></div>
        <noscript><p>Włącz JavaScript, aby zobaczyć komiksy.</p></noscript>
        <template id="comic-template">
          <article class="comic-card">
            <div class="comic-meta"><time></time></div>
            <div class="comic-caption"><h3></h3></div>
            <button class="comic-image-button" type="button">
              <img alt="" />
              <span class="zoom-hint" aria-hidden="true">Powiększ ↗</span>
            </button>
          </article>
        </template>
      </section>

      <section class="about" id="kontakt" aria-labelledby="about-title">
        <div class="about-label"><span>✳</span> Kontakt</div>
        <div>
          <p>Chcesz podzielic się czymś albo zamówić u mnie komiks?</p>
        </div>
        <a href="mailto:banasmaciek@gmail.pl">Napisz do mnie <span aria-hidden="true">↗</span></a>
      </section>
    </main>

    <footer>
      <a class="logo footer-logo" href="#top"><span class="logo-mark" aria-hidden="true"></span>MUCZEK I PRZYJACIELE</a>
      <p class="visit-counter" title="Statystyki GoatCounter mogą być opóźnione do czterech godzin.">
        Odwiedziny: <span id="visit-count" role="status">Ładowanie…</span>
      </p>
      <p>© 2026 Banas.</p>
    </footer>

    <dialog class="lightbox" aria-label="Powiększony komiks">
      <button class="lightbox-close" type="button" aria-label="Zamknij">×</button>
      <img alt="" />
    </dialog>

    <script src="comics.js"></script>
    <script src="script.js"></script>
  </body>
</html>
